name: Recommandations quotidiennes

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 à Paris en hiver, 08:00 en été
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
    inputs:
      dry_run:
        description: "Test : affiche dans les logs, n'envoie rien sur Discord"
        type: boolean
        default: false
      only:
        description: "Catégories à traiter, séparées par des virgules (ex: jeux,films). Vide = toutes"
        type: string
        default: ""

permissions:
  contents: write          # nécessaire pour committer history.json

concurrency:
  group: daily-reco
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer et envoyer les recommandations
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY: ${{ github.event.inputs.only }}
          DISCORD_WEBHOOK_JEUX: ${{ secrets.DISCORD_WEBHOOK_JEUX }}
          DISCORD_WEBHOOK_FILMS: ${{ secrets.DISCORD_WEBHOOK_FILMS }}
          DISCORD_WEBHOOK_MANGA: ${{ secrets.DISCORD_WEBHOOK_MANGA }}
          DISCORD_WEBHOOK_ANIME: ${{ secrets.DISCORD_WEBHOOK_ANIME }}
          DISCORD_WEBHOOK_LIVRES: ${{ secrets.DISCORD_WEBHOOK_LIVRES }}
          DISCORD_WEBHOOK_KDRAMA: ${{ secrets.DISCORD_WEBHOOK_KDRAMA }}
          DISCORD_WEBHOOK_SERIES: ${{ secrets.DISCORD_WEBHOOK_SERIES }}

      - name: Sauvegarder l'historique (anti-doublons)
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "reco-bot"
          git config user.email "reco-bot@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "Pas de changement dans l'historique."
          else
            git commit -m "chore: historique du $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
